  <linearGradient id="bumper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e8edf1"/><stop offset="1" stop-color="#8995a1"/></linearGradient>
  <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
