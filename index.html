<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>차량운행일지 | 제한진천팀</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111318;
      --panel: #1b1f27;
      --panel-2: #232832;
      --border: #343b47;
      --text: #f3f5f7;
      --muted: #9ba5b3;
      --green: #79d7b0;
      --green-dark: #20372e;
      --red: #f19b9b;
      --blue: #91b9ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 18px;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .container { max-width: 760px; margin: 0 auto; }
    header {
      display: flex; align-items: center; gap: 13px;
      padding: 22px; margin-bottom: 16px;
      border: 1px solid var(--border); border-radius: 16px;
      background: linear-gradient(135deg, #1b2823, #1b1f27 72%);
    }
    .brand-icon {
      width: 48px; height: 48px; flex: 0 0 48px;
      display: grid; place-items: center; border-radius: 13px;
      background: #263a31; color: var(--green); font-size: 25px;
    }
    h1 { font-size: 23px; margin: 0 0 5px; }
    header p { color: #b5c5bd; margin: 0; font-size: 14px; }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 15px; padding: 19px; margin-bottom: 15px;
    }
    h2 { font-size: 17px; margin: 0 0 16px; }
    label { display: block; font-size: 13px; font-weight: 650; color: #d7dce3; margin: 13px 0 7px; }
    input, select, textarea, button {
      width: 100%; font: inherit; border-radius: 10px;
    }
    input, select, textarea {
      min-height: 45px; padding: 11px 12px;
      border: 1px solid #3b4350; background: #14171d; color: var(--text);
    }
    input::placeholder, textarea::placeholder { color: #77818f; }
    input:focus, select:focus, textarea:focus { outline: 2px solid #427e65; border-color: var(--green); }
    textarea { resize: vertical; min-height: 80px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .destination-control {
      display: flex;
      align-items: stretch;
      gap: 7px;
    }
    .destination-control input {
      min-width: 0;
      flex: 1;
    }
    .apply-destination {
      width: auto;
      flex: 0 0 auto;
      padding: 8px 11px;
      white-space: nowrap;
      font-size: 12px;
    }
    .distance {
      margin-top: 15px; padding: 14px;
      border: 1px solid #345746; background: #1b2a24;
      border-radius: 11px; display: flex; align-items: center;
      justify-content: space-between; gap: 12px;
    }
    .distance-label { font-weight: 650; }
    .hint { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; font-weight: 400; }
    .distance strong { color: var(--green); font-size: 21px; white-space: nowrap; }
    button { border: 0; min-height: 45px; padding: 11px 13px; cursor: pointer; font-weight: 700; }
    button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
    .primary { background: var(--green); color: #102219; font-size: 16px; }
    .secondary { background: #26372f; border: 1px solid #3d6855; color: #baf0d5; }
    .soft { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); }
    .danger { background: #3b2529; border: 1px solid #674047; color: var(--red); }
    .route-line {
      display: flex; align-items: center; flex-wrap: wrap; gap: 7px;
      min-height: 46px; padding: 9px; margin-top: 8px;
      border: 1px solid var(--border); background: #15181e; border-radius: 11px;
    }
    .route-chip {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid #3d6855; background: #20372e; color: #baf0d5;
      border-radius: 9px; padding: 8px 10px; cursor: pointer;
      font-size: 13px; font-weight: 650; width: auto; min-height: 0;
    }
    .route-dash { color: #788392; }
    .empty-route { color: var(--muted); font-size: 13px; padding: 3px; }
    .route-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 11px; }
    .small-note { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 10px 0 0; }
    .event-list { display: grid; gap: 9px; margin-top: 12px; }
    .event-item {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 11px 12px; background: #15181e; border: 1px solid var(--border); border-radius: 10px;
    }
    .event-item strong { display: block; font-size: 13px; }
    .event-item span { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
    .event-item button { width: auto; min-height: 35px; padding: 7px 10px; }
    #message { text-align: center; color: var(--green); font-size: 13px; line-height: 1.5; }
    dialog {
      width: min(430px, calc(100% - 28px)); max-height: 82vh; overflow: auto;
      border: 1px solid #424b58; border-radius: 16px; padding: 0;
      background: #1b1f27; color: var(--text);
    }
    dialog::backdrop { background: #000b; backdrop-filter: blur(3px); }
    .dialog-inner { padding: 19px; }
    .dialog-inner h3 { margin: 0 0 7px; font-size: 18px; }
    .dialog-subtitle { margin: 0 0 14px; color: var(--muted); font-size: 12px; }
    .option-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .option-list button { text-align: left; background: #252b35; border: 1px solid #3a4350; color: var(--text); }
    .option-list button:active { background: #294236; }
    .scroll-list { max-height: 42vh; overflow-y: auto; padding-right: 3px; }
    .picker-layout {
      display: grid;
      grid-template-columns: 0.85fr 1.15fr;
      gap: 10px;
      margin-top: 17px;
    }
    .picker-heading {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .branch-options {
      display: grid;
      gap: 8px;
    }
    .branch-options button {
      text-align: center;
      background: #252b35;
      border: 1px solid #3a4350;
      color: var(--text);
    }
    .branch-options button.selected {
      background: #20372e;
      border-color: var(--green);
      color: #baf0d5;
    }
    .office-options {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
      max-height: 225px;
      overflow-y: auto;
      padding-right: 3px;
    }
    .office-options button {
      text-align: center;
      background: #252b35;
      border: 1px solid #3a4350;
      color: var(--text);
    }
    .office-placeholder {
      min-height: 110px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 10px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }
    .dialog-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 16px; }
    .dialog-actions.single { grid-template-columns: 1fr; }
    .hidden { display: none !important; }
    .fuel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 520px) {
      body { padding: 10px; }
      header { padding: 17px; }
      h1 { font-size: 21px; }
      .card { padding: 15px; }
      .grid, .fuel-grid { grid-template-columns: 1fr 1fr; gap: 9px; }
      .distance { align-items: flex-start; }
      .distance strong { font-size: 19px; }
      .route-actions { grid-template-columns: 1fr; }
      .option-list { grid-template-columns: 1fr 1fr; }
      .picker-layout {
        grid-template-columns: 0.85fr 1.15fr;
        gap: 8px;
      }
      .branch-options button,
      .office-options button {
        padding: 9px 5px;
        font-size: 12px;
      }
    }
    @media print {
      :root { color-scheme: light; --bg: #fff; --panel: #fff; --panel-2: #f5f5f5; --border: #ccc; --text: #111; --muted: #555; }
      body { background: #fff !important; color: #111 !important; padding: 0; }
      header, .card, .distance { background: #fff !important; color: #111 !important; border: 1px solid #bbb; box-shadow: none; }
      header p, .hint, .small-note { color: #555 !important; }
      input, select, textarea { background: #fff !important; color: #111 !important; border-color: #bbb; }
      button, dialog, .route-actions, #message { display: none !important; }
      .route-line, .event-item { background: #fff !important; color: #111 !important; }
      .route-chip { background: #fff !important; color: #111 !important; border-color: #aaa; }
      .distance strong { color: #111 !important; }
    }
  </style>
</head>
<body>
<main class="container">
  <header>
    <div class="brand-icon" aria-hidden="true">🚚</div>
    <div>
      <h1>차량운행일지</h1>
      <p>제한진천팀</p>
    </div>
  </header>

  <form id="logForm">
    <section class="card">
      <h2>📅 운행 기본정보</h2>
      <label for="date">운행일자</label>
      <input type="date" id="date" required>

      <label for="weather">날씨</label>
      <select id="weather">
        <option>맑음</option><option>흐림</option><option>비</option><option>눈</option>
        <option value="기타">기타 (직접 입력)</option>
      </select>
      <input id="customWeather" class="hidden" type="text" placeholder="날씨 직접 입력" style="margin-top:9px;">

      <div class="grid">
        <div>
          <label for="startKm">출발 주행거리 (km)</label>
          <input type="text" inputmode="decimal" id="startKm" placeholder="예: 12,500" autocomplete="off">
        </div>
        <div>
          <label for="endKm">도착 주행거리 (km)</label>
          <input type="text" inputmode="decimal" id="endKm" placeholder="예: 12,650" autocomplete="off">
        </div>
      </div>
      <div class="distance">
        <div class="distance-label">총 운행거리<span class="hint">(도착 주행거리 입력 시 자동계산)</span></div>
        <strong><span id="distance">0</span> km</strong>
      </div>
    </section>

    <section class="card">
      <h2>📍 운행 경로</h2>
      <div class="grid">
        <div>
          <label for="origin">출발지</label>
          <input id="origin" value="남청주" autocomplete="off">
        </div>
        <div>
          <label for="destination">최종 도착지</label>
          <div class="destination-control">
            <input id="destination" value="남청주" autocomplete="off">
            <button type="button" class="secondary apply-destination" id="applyDestination">도착지 적용</button>
          </div>
        </div>
      </div>

      <label>경유지 순서</label>
      <div id="waypoints" class="route-line" aria-live="polite">
        <span class="empty-route">출발지를 기준으로 경유지를 추가해 주세요.</span>
      </div>

      <div class="route-actions">
        <button type="button" class="secondary" id="openOfficePicker">＋ 경유지 추가</button>
      </div>
      <p class="small-note">경로 목록의 장소를 누르면 변경·추가·삭제할 수 있습니다. 첫 번째 출발지도 같은 방식으로 관리합니다.</p>    </section>

    <section class="card">
      <h2>⛽ 주유 · 요소수 기록</h2>
      <p class="small-note" style="margin-top:-7px;">운행 중 발생한 기록을 필요한 만큼 추가하세요.</p>
      <div class="fuel-grid">
        <div>
          <label for="fuelDate">기록 시각</label>
          <input type="datetime-local" id="fuelDate">
        </div>
        <div>
          <label for="eventType">종류</label>
          <select id="eventType"><option value="주유">주유</option><option value="요소수">요소수</option></select>
        </div>
        <div>
          <label for="eventAmount">주입량 (L)</label>
          <input type="text" inputmode="decimal" id="eventAmount" placeholder="예: 45.2">
        </div>
        <div>
          <label for="eventCost">금액 (원)</label>
          <input type="text" inputmode="numeric" id="eventCost" placeholder="예: 80,000">
        </div>
      </div>
      <label for="eventMemo">주유소 / 메모 (선택)</label>
      <input id="eventMemo" placeholder="주유소명 또는 특이사항">
      <button type="button" class="secondary" id="addEvent" style="margin-top:12px;">＋ 기록 추가</button>
      <div id="eventList" class="event-list"></div>
    </section>

    <section class="card">
      <h2>📝 비고 및 메모</h2>
      <textarea id="memo" placeholder="특이사항이나 메모 입력"></textarea>
    </section>

    <button class="primary" type="submit">입력 내용 확인</button>
    <p id="message" role="status"></p>
  </form>
</main>

<dialog id="routePickerDialog">
  <div class="dialog-inner">
    <h3>경유지 선택</h3>
    <p class="dialog-subtitle">장소를 직접 입력하거나 지사를 선택하세요.</p>

    <div class="destination-control">
      <input id="routeSearchInput" placeholder="영업소명 또는 장소 직접 입력" autocomplete="off">
      <button type="button" class="secondary apply-destination" id="addTypedPlace">입력</button>
    </div>

    <div class="picker-layout">
      <div>
        <p class="picker-heading">지사 선택</p>
        <div id="branchOptions" class="branch-options"></div>
      </div>

      <div>
        <p class="picker-heading">영업소 목록</p>
        <div id="officePlaceholder" class="office-placeholder">
          지사를 선택하면<br>목록이 표시됩니다.
        </div>
        <div id="officeOptions" class="office-options hidden"></div>
      </div>
    </div>

    <div class="dialog-actions single">
      <button type="button" class="soft" data-close="routePickerDialog">취소</button>
    </div>
  </div>
</dialog>

<dialog id="routeActionDialog">
  <div class="dialog-inner">
    <h3 id="routeActionTitle">경로 편집</h3>
    <p class="dialog-subtitle">원하는 작업을 선택하세요.</p>
    <div class="dialog-actions single">
      <button type="button" class="secondary" id="routeChange">변경</button>
      <button type="button" class="secondary" id="routeInsert">이 위치 앞에 경유지 추가</button>
      <button type="button" class="danger" id="routeDelete">삭제</button>
      <button type="button" class="soft" data-close="routeActionDialog">취소</button>
    </div>
  </div>
</dialog>

<script>
  const offices = {
    "진천지사": ["남이천", "일죽", "대소", "진천", "증평", "오창", "서청주"],
    "보은지사": ["문의", "회인", "보은", "속리산", "화서", "남상주"],
    "상주지사": ["상주", "북상주", "점촌함창", "문경새재"]
  };
  const $ = id => document.getElementById(id);
  const waypointList = [];
  const eventList = [];
  let selectedBranch = "";
  let routeEditMode = "add";
  let routeEditIndex = -1;
  let routeActionType = "";
  let routeActionIndex = -1;

  $("date").value = localDateString(new Date());
  $("fuelDate").value = localDateTimeString(new Date());
  renderWaypoints();

  function localDateString(date) {
    const offset = date.getTimezoneOffset();
    return new Date(date.getTime() - offset * 60000).toISOString().slice(0, 10);
  }
  function localDateTimeString(date) {
    const offset = date.getTimezoneOffset();
    return new Date(date.getTime() - offset * 60000).toISOString().slice(0, 16);
  }
  function parseNumber(value) {
    return Number(String(value).replace(/,/g, "").trim());
  }
  function formatIntegerInput(input) {
    const raw = input.value.replace(/,/g, "").replace(/[^\d.]/g, "");
    const parts = raw.split(".");
    const integer = (parts[0] || "").replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    input.value = parts.length > 1 ? integer + "." + parts.slice(1).join("") : integer;
  }
  ["startKm", "endKm", "eventCost"].forEach(id => {
    $(id).addEventListener("input", () => {
      const el = $(id);
      const pos = el.selectionStart;
      const before = el.value;
      formatIntegerInput(el);
      if (pos !== null && before.length === el.value.length) el.setSelectionRange(pos, pos);
      if (id === "startKm" || id === "endKm") updateDistance();
    });
    $(id).addEventListener("blur", () => {
      if (id === "startKm" || id === "endKm") updateDistance();
    });
  });
  $("eventAmount").addEventListener("input", () => {
    $("eventAmount").value = $("eventAmount").value.replace(/[^\d.]/g, "");
  });
  function updateDistance() {
    const startRaw = $("startKm").value.trim();
    const endRaw = $("endKm").value.trim();
    const start = parseNumber(startRaw);
    const end = parseNumber(endRaw);
    const valid = startRaw !== "" && endRaw !== "" && Number.isFinite(start) && Number.isFinite(end) && end >= start;
    const distance = valid ? end - start : 0;
    $("distance").textContent = distance.toLocaleString("ko-KR", { maximumFractionDigits: 1 });
    $("distance").style.color = startRaw !== "" && endRaw !== "" && end < start ? "var(--red)" : "var(--green)";
  }

  $("weather").addEventListener("change", () => {
    $("customWeather").classList.toggle("hidden", $("weather").value !== "기타");
  });

  document.querySelectorAll("[data-close]").forEach(button => {
    button.addEventListener("click", () => $(button.dataset.close).close());
  });

  // 경로 선택 팝업 열기
  function openRoutePicker(mode = "add", index = -1) {
    routeEditMode = mode;
    routeEditIndex = index;
    selectedBranch = "";

    $("routeSearchInput").value = "";
    $("branchOptions").innerHTML = "";
    $("officeOptions").innerHTML = "";
    $("officeOptions").classList.add("hidden");
    $("officePlaceholder").classList.remove("hidden");

    Object.keys(offices).forEach(branch => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = branch;

      button.addEventListener("click", () => {
        selectedBranch = branch;

        document.querySelectorAll("#branchOptions button")
          .forEach(item => item.classList.remove("selected"));
        button.classList.add("selected");

        renderOfficeOptions();
      });

      $("branchOptions").appendChild(button);
    });

    $("routePickerDialog").showModal();
    $("routeSearchInput").focus();
  }

  // 선택한 지사의 영업소 목록 표시
  function renderOfficeOptions() {
    $("officeOptions").innerHTML = "";
    $("officePlaceholder").classList.add("hidden");
    $("officeOptions").classList.remove("hidden");

    (offices[selectedBranch] || []).forEach(name => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = name;

      button.addEventListener("click", () => {
        applyRoutePlace(name);
      });

      $("officeOptions").appendChild(button);
    });
  }

  // 장소를 경로에 반영
  function applyRoutePlace(name) {
    name = name.trim();
    if (!name) return;

    if (routeEditMode === "origin") {
      $("origin").value = name;
    } else if (routeEditMode === "change") {
      waypointList[routeEditIndex] = name;
    } else if (routeEditMode === "insert") {
      waypointList.splice(routeEditIndex, 0, name);
    } else {
      waypointList.push(name);
    }

    renderWaypoints();
    $("routePickerDialog").close();
  }

  // 상단 직접 입력으로 장소 추가·변경
  $("addTypedPlace").addEventListener("click", () => {
    const name = $("routeSearchInput").value.trim();

    if (!name) {
      alert("장소 이름을 입력해 주세요.");
      $("routeSearchInput").focus();
      return;
    }

    applyRoutePlace(name);
  });

  $("routeSearchInput").addEventListener("keydown", event => {
    if (event.key === "Enter") {
      event.preventDefault();
      $("addTypedPlace").click();
    }
  });

  // 경유지 추가 버튼
  $("openOfficePicker").addEventListener("click", () => {
    openRoutePicker("add");
  });

  // 경로 항목을 눌렀을 때 작업 메뉴
  function openRouteAction(type, index = -1) {
    routeActionType = type;
    routeActionIndex = index;

    const isOrigin = type === "origin";

    $("routeActionTitle").textContent = isOrigin
      ? "출발지 편집"
      : "경유지 편집";

    $("routeInsert").classList.toggle("hidden", isOrigin);
    $("routeActionDialog").showModal();
  }

  // 변경
  $("routeChange").addEventListener("click", () => {
    const mode = routeActionType === "origin" ? "origin" : "change";
    const index = routeActionIndex;

    $("routeActionDialog").close();
    openRoutePicker(mode, index);
  });

  // 선택한 경유지 바로 앞에 추가
  $("routeInsert").addEventListener("click", () => {
    const index = routeActionIndex;

    $("routeActionDialog").close();
    openRoutePicker("insert", index);
  });

  // 삭제
  $("routeDelete").addEventListener("click", () => {
    if (routeActionType === "origin") {
      $("origin").value = "";
    } else {
      waypointList.splice(routeActionIndex, 1);
    }

    renderWaypoints();
    $("routeActionDialog").close();
  });

  // 경로 목록 다시 그리기
  function renderWaypoints() {
    const holder = $("waypoints");
    holder.innerHTML = "";

    const route = [];
    const origin = $("origin").value.trim();

    if (origin) {
      route.push({ name: origin, type: "origin" });
    }

    waypointList.forEach((name, index) => {
      route.push({ name, type: "waypoint", index });
    });

    if (!route.length) {
      const empty = document.createElement("span");
      empty.className = "empty-route";
      empty.textContent = "경로가 비어 있습니다. 경유지를 추가해 주세요.";
      holder.appendChild(empty);
      return;
    }

    route.forEach((item, routeIndex) => {
      if (routeIndex > 0) {
        const dash = document.createElement("span");
        dash.className = "route-dash";
        dash.textContent = "-";
        holder.appendChild(dash);
      }

      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "route-chip";

      if (item.type === "origin") {
        chip.textContent = item.name + " (출발)";
        chip.title = "출발지 변경 또는 삭제";
        chip.addEventListener("click", () => {
          openRouteAction("origin");
        });
      } else {
        chip.textContent = item.name;
        chip.title = "변경 / 이 위치 앞에 추가 / 삭제";
        chip.addEventListener("click", () => {
          openRouteAction("waypoint", item.index);
        });
      }

      holder.appendChild(chip);
    });
  }

  $("origin").addEventListener("input", renderWaypoints);

  // 최종 도착지를 경유지 맨 마지막에 적용
  $("applyDestination").addEventListener("click", () => {
    const destination = $("destination").value.trim();

    if (!destination) {
      alert("최종 도착지를 입력해 주세요.");
      $("destination").focus();
      return;
    }

    if (waypointList[waypointList.length - 1] === destination) {
      alert("이미 마지막 경유지에 적용된 장소입니다.");
      return;
    }

    waypointList.push(destination);
    renderWaypoints();
  });

  // 최종 도착지를 경유지 맨 마지막에 적용
  $("applyDestination").addEventListener("click", () => {
    const destination = $("destination").value.trim();

    if (!destination) {
      alert("최종 도착지를 입력해 주세요.");
      $("destination").focus();
      return;
    }

    // 마지막 경유지와 같을 때만 중복 방지
    if (waypointList[waypointList.length - 1] === destination) {
      alert("이미 마지막 경유지에 적용된 장소입니다.");
      return;
    }

    waypointList.push(destination);
    renderWaypoints();
  });

  $("addEvent").addEventListener("click", () => {
    const type = $("eventType").value;
    const amountText = $("eventAmount").value.trim();
    const costText = $("eventCost").value.trim();
    const memo = $("eventMemo").value.trim();
    if (!amountText && !costText && !memo) {
      alert("주입량, 금액 또는 메모 중 하나는 입력해 주세요.");
      return;
    }
    eventList.push({
      time: $("fuelDate").value,
      type,
      amount: amountText ? parseNumber(amountText) : null,
      cost: costText ? parseNumber(costText) : null,
      memo
    });
    renderEvents();
    $("eventAmount").value = "";
    $("eventCost").value = "";
    $("eventMemo").value = "";
    $("fuelDate").value = localDateTimeString(new Date());
    });
  function renderEvents() {
    const holder = $("eventList");
    holder.innerHTML = "";
    eventList.forEach((item, index) => {
      const row = document.createElement("div");
      row.className = "event-item";
      const detail = document.createElement("div");
      const title = document.createElement("strong");
      title.textContent = `${index + 1}. ${item.type}`;
      const desc = document.createElement("span");
      const amount = item.amount !== null ? `${item.amount.toLocaleString("ko-KR")} L` : "";
      const cost = item.cost !== null ? `${item.cost.toLocaleString("ko-KR")}원` : "";
      desc.textContent = [item.time.replace("T", " "), amount, cost, item.memo].filter(Boolean).join(" · ");
      detail.append(title, desc);
      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "danger";
      remove.textContent = "삭제";
      remove.addEventListener("click", () => { eventList.splice(index, 1); renderEvents(); });
      row.append(detail, remove);
      holder.appendChild(row);
    });
  }

  $("logForm").addEventListener("submit", event => {
    event.preventDefault();
    const startRaw = $("startKm").value.trim();
    const endRaw = $("endKm").value.trim();
    const start = startRaw ? parseNumber(startRaw) : null;
    const end = endRaw ? parseNumber(endRaw) : null;
    if (start !== null && end !== null && end < start) {
      alert("도착 주행거리는 출발 주행거리보다 작을 수 없습니다.");
      return;
    }
    const weather = $("weather").value === "기타" ? $("customWeather").value.trim() : $("weather").value;
    const result = {
      date: $("date").value,
      weather,
      startKm: start,
      endKm: end,
      distance: start !== null && end !== null ? end - start : null,
      origin: $("origin").value.trim(),
      destination: $("destination").value.trim(),
      waypoints: waypointList.join("-"),
      fuelAndAdBlue: eventList,
      memo: $("memo").value.trim()
    };
    const finalRoute = [...waypointList];

    // 도착지를 아직 적용하지 않았다면 최종 경로에만 표시
    if (
      result.destination &&
      finalRoute[finalRoute.length - 1] !== result.destination
    ) {
      finalRoute.push(result.destination);
    }

    $("message").textContent =
      `입력 확인 완료 · 경로: ${[result.origin, ...finalRoute].filter(Boolean).join("-") || "없음"} · 주유/요소수 기록 ${eventList.length}건. 현재는 화면 입력 확인 단계이며 서버에 영구 저장되지는 않습니다.`;
    console.log("차량운행일지 입력 확인:", result);
  });
</script>
</body>
</html>
